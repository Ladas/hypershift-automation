    - orphaned_oidc.stdout | default('') | trim | length > 0

# =============================================================================
# FINAL VERIFICATION AND SUMMARY
# =============================================================================

# Final check if cluster still exists
- name: "destroy | final verification for {{ cluster.name }}"
  kubernetes.core.k8s_info:
    api_version: hypershift.openshift.io/v1beta1
    kind: HostedCluster
    namespace: clusters
    name: "{{ cluster.name }}"
  register: hc_final
  changed_when: false
  failed_when: false
  when:
    - destroy
    - cluster_exists | default(false)

# Summary of cleanup
- name: "destroy | cleanup summary for {{ cluster.name }}"
  ansible.builtin.debug:
    msg: |
      === Cluster Destroy Summary for {{ cluster.name }} ===

      Kubernetes:
      - Cluster deleted: {{ 'Yes' if (hc_final.resources is not defined or hc_final.resources | length == 0) else 'No - may need manual cleanup' }}
      - Finalizers removed: {{ 'Yes' if (finalizer_removal.rc | default(1)) == 0 else 'N/A or failed' }}

      AWS Resources Cleaned:
      - EC2 Instances: {{ 'cleaned' if (orphaned_instances.stdout | default('') | trim | length > 0) else 'none found' }}
      - Load Balancers: {{ 'cleaned' if (orphaned_lbs.stdout | default('') | trim | length > 0) else 'none found' }}
      - EBS Volumes: {{ 'cleaned' if (orphaned_volumes.stdout | default('') | trim | length > 0) else 'none found' }}
      - NAT Gateways: {{ 'cleaned' if (orphaned_nats.stdout | default('') | trim | length > 0) else 'none found' }}
      - Elastic IPs: {{ 'cleaned' if (orphaned_eips.stdout | default('') | trim | length > 0) else 'none found' }}
      - Internet Gateways: {{ 'cleaned' if (orphaned_igws.stdout | default('') | trim | length > 0) else 'none found' }}
      - Subnets: {{ 'cleaned' if (orphaned_subnets.stdout | default('') | trim | length > 0) else 'none found' }}
      - Route Tables: {{ 'cleaned' if (orphaned_rtbs.stdout | default('') | trim | length > 0) else 'none found' }}
      - Security Groups: {{ 'cleaned' if (orphaned_sgs.stdout | default('') | trim | length > 0) else 'none found' }}
      - VPC Endpoints: {{ 'cleaned' if (vpce_cleanup is defined and vpce_cleanup.stdout | default('') | trim | length > 0) else 'none found' }}
      - VPCs: {{ 'cleaned' if (orphaned_vpcs.stdout | default('') | trim | length > 0) else 'none found' }}
      - Route53 Zones: {{ 'cleaned' if (orphaned_zones.stdout | default('') | trim | length > 0) else 'none found' }}
      - IAM Roles: {{ 'cleaned' if (orphaned_roles.stdout | default('') | trim | length > 0) else 'none found' }}
      - Instance Profiles: {{ 'cleaned' if (orphaned_profiles.stdout | default('') | trim | length > 0) else 'none found' }}
      - OIDC Providers: {{ 'cleaned' if (orphaned_oidc.stdout | default('') | trim | length > 0) else 'none found' }}
  when:
    - destroy
    - cluster_exists | default(false)

# =============================================================================
# STAGE 7: Clean up control plane namespace
# =============================================================================
# The control plane namespace (clusters-<cluster-name>) may remain after
# HostedCluster deletion. This contains deployments, pods, secrets, etc.
# that were managing the hosted control plane.

- name: "destroy | check if control plane namespace exists for {{ cluster.name }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "clusters-{{ cluster.name }}"
  register: cp_namespace
  changed_when: false
  failed_when: false
  when: destroy

- name: "destroy | clean up control plane namespace for {{ cluster.name }}"
  when:
    - destroy
    - cp_namespace.resources is defined
    - cp_namespace.resources | length > 0
  block:
    # Delete workloads first (these create/recreate other resources)
    - name: "destroy | delete deployments in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete deployment --all -n "clusters-{{ cluster.name }}" --grace-period=0 --force --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete replicasets in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete replicaset --all -n "clusters-{{ cluster.name }}" --grace-period=0 --force --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete statefulsets in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete statefulset --all -n "clusters-{{ cluster.name }}" --grace-period=0 --force --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete pods in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete pod --all -n "clusters-{{ cluster.name }}" --grace-period=0 --force --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete services in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete service --all -n "clusters-{{ cluster.name }}" --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete secrets in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete secret --all -n "clusters-{{ cluster.name }}" --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete configmaps in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete configmap --all -n "clusters-{{ cluster.name }}" --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    - name: "destroy | delete PVCs in control plane namespace {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl delete pvc --all -n "clusters-{{ cluster.name }}" --ignore-not-found 2>/dev/null || true
      failed_when: false
      changed_when: true

    # Remove any finalizers from remaining resources
    - name: "destroy | patch finalizers on remaining resources in {{ cluster.name }}"
      ansible.builtin.shell: |
        for kind in hostedcontrolplane deployment replicaset statefulset daemonset service secret configmap pvc; do
          kubectl get "$kind" -n "clusters-{{ cluster.name }}" -o name 2>/dev/null | while read -r name; do
            kubectl patch "$name" -n "clusters-{{ cluster.name }}" -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
          done
        done
      failed_when: false
      changed_when: true

    # Delete the namespace
    - name: "destroy | delete control plane namespace {{ cluster.name }}"
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "clusters-{{ cluster.name }}"
        wait: no
      failed_when: false

    # Patch namespace finalizers if needed
    - name: "destroy | patch namespace finalizers for {{ cluster.name }}"
      ansible.builtin.shell: |
        kubectl patch namespace "clusters-{{ cluster.name }}" -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
      failed_when: false
      changed_when: true

    # Wait for namespace deletion
    - name: "destroy | wait for control plane namespace {{ cluster.name }} to be deleted"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "clusters-{{ cluster.name }}"
      register: cp_namespace_final
      until: cp_namespace_final.resources | length == 0
      retries: 24
      delay: 5
      failed_when: false

    - name: "destroy | log control plane namespace cleanup result for {{ cluster.name }}"
      ansible.builtin.debug:
        msg: "Control plane namespace clusters-{{ cluster.name }}: {{ 'deleted' if (cp_namespace_final.resources | length == 0) else 'still exists - may need manual cleanup' }}"

# Fail if cluster still exists after cleanup
- name: "destroy | fail if cluster {{ cluster.name }} still exists"
  ansible.builtin.fail:
    msg: |
      Cluster {{ cluster.name }} still exists after cleanup attempt.
      This may require manual intervention:
      1. Check HyperShift operator logs: kubectl logs -n hypershift deployment/operator
      2. Manually remove finalizers: kubectl patch hostedcluster {{ cluster.name }} -n clusters --type=json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'
      3. Check for remaining AWS resources with tag: kubernetes.io/cluster/{{ cluster.name }}=owned
  when:
    - destroy
    - cluster_exists | default(false)
    - hc_final.resources is defined
    - hc_final.resources | length > 0

# Clean up local deployment directory
- name: "destroy | remove local deployment directory for {{ cluster.name }}"
  ansible.builtin.file:
    state: absent
    path: "{{ deployment_dir }}/{{ cluster.name }}"
  when:
    - destroy
    - cluster_exists | default(false)
