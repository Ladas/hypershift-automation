#Set hosted control plane var
hcp: hosted-control-planes

#Set gather_facts to false to speed up playbook execution
gather_facts: false

#Set default locations for cluster and cloud artifacts
deployment_dir: "{{lookup('ansible.builtin.env','HOME')}}/clusters/hcp"
pull_secret_path: "{{lookup('ansible.builtin.env', 'HOME')}}/.pullsecret.json"
sts_creds:
  dir: "{{lookup('ansible.builtin.env','HOME')}}/.aws/sts-creds"
  file: sts-creds.json

# Base domain - default value (can be overridden in vars.yml)
domain: example.com

#We need the role name set for both IAM tasks and Hosted Cluster management tasks
iam:
  hcp_role_name: hypershift_cli_role
  hcp_policy_name: hypershift_cli_policy
  hcp_users: {}
    #- list of users to bind to IAM policy

#Validated Parameters
wait_timeout_seconds: 900        # Max time to wait (900 seconds = 15 minutes)
check_interval_seconds: 10       # How often to poll the resource status

# Destroy-specific timeouts
hcp_destroy_timeout_seconds: 900        # Max time for hcp destroy async job (15 minutes)
destroy_wait_timeout_seconds: 600       # Max time to wait for hcp destroy to complete (10 minutes - 60 retries * 10s)

# Tag-based AWS resource cleanup (fallback when operator fails)
# Set to false to disable automatic cleanup of orphaned AWS resources
cleanup_orphaned_aws_resources: true

# Additional tags to apply to AWS resources created by hcp CLI
# Format: "Key1=Value1,Key2=Value2" or list ["Key1=Value1", "Key2=Value2"]
# Can be set globally here or per-cluster in vars.yml
# Example: additional_tags: "ManagedBy=hypershift-ci,Environment=test"
additional_tags: ""
